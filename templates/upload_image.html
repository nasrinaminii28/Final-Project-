{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center mt-4">

<div class="col-lg-8">

    <div class="card shadow border-0">

        <div class="card-body p-4">

            <!-- Header -->

            <div class="text-center mb-4">

                <i class="bi bi-image text-info"
                   style="font-size: 50px;"></i>

                <h2 class="mt-2">

                    Upload an Image

                </h2>

                <p class="text-muted">

                    Share your image with others.

                </p>

            </div>


            <!-- Form -->

            <form method="POST"
                  enctype="multipart/form-data">


                <!-- Image File -->

                <div class="mb-3">

                    <label class="form-label">

                        Select Image

                    </label>

                    <input
                        type="file"
                        name="image"
                        class="form-control"
                        accept="image/*"
                        required>

                </div>


                <!-- Title -->

                <div class="mb-3">

                    <label class="form-label">

                        Image Title

                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Enter image title"
                        required>

                </div>


                <!-- Category -->

                <div class="mb-3">

                    <label class="form-label">

                        Category

                    </label>

                    <input
                        type="text"
                        name="category"
                        class="form-control"
                        placeholder="Enter image category"
                        required>

                </div>


                <!-- Tags -->

                <div class="mb-3">

                    <label class="form-label">

                        Tags

                    </label>

                    <input
                        type="text"
                        name="tags"
                        class="form-control"
                        placeholder="Example: Nature, Forest, Mountain">

                </div>


                <!-- Description -->

                <div class="mb-4">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="6"
                        placeholder="Write a description for your image..."
                        required></textarea>

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <a href="{{ url_for('person', code=session['user_code']) }}"
                       class="btn btn-outline-secondary w-50">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="btn btn-info w-50">

                        <i class="bi bi-cloud-arrow-up"></i>

                        Upload Image

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</div>

{% endblock %}
