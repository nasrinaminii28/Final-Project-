{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-lg-8">

    <div class="card shadow border-0">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <i class="bi bi-person-gear text-primary"
                   style="font-size: 55px;"></i>

                <h2 class="fw-bold mt-2">
                    Edit User
                </h2>

                <p class="text-muted">
                    Manage user information and permissions
                </p>

            </div>


            <form method="POST">

                <!-- User Code -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        User Code

                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ user.code }}"
                           disabled>

                </div>


                <!-- Name -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        Name

                    </label>

                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ user.name }}"
                           required>

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        Email

                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ user.email }}"
                           required>

                </div>


                <!-- Work Field -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">

                        Work Field

                    </label>

                    <input type="text"
                           name="work_field"
                           class="form-control"
                           value="{{ user.work_field or '' }}">

                </div>


                <!-- Role -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Role

                    </label>

                    <select name="role"
                            class="form-select">

                        <option value="user"
                            {% if user.role == "user" %}
                            selected
                            {% endif %}>

                            User

                        </option>

                        <option value="admin"
                            {% if user.role == "admin" %}
                            selected
                            {% endif %}>

                            Admin

                        </option>

                    </select>

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary flex-fill">

                        <i class="bi bi-check-circle"></i>

                        Save Changes

                    </button>


                    <a href="{{ url_for('admin') }}"
                       class="btn btn-outline-secondary flex-fill">

                        <i class="bi bi-arrow-left"></i>

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</div>

{% endblock %}
